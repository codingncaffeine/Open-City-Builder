name: build

on:
  push:
  pull_request:

jobs:
  # The hook DLL builds only with the 2003 compiler toolkit, which CI cannot download, so it is built and matched
  # locally (tools/build.sh, tools/match.sh). CI checks that no original content slipped into the tree, that the
  # decompiled sources compile as portable C++ with today's compilers and standard libraries, and builds the tools.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: No original content
        run: tools/check-content.sh
      - name: Sources compile with modern compilers
        run: tools/check-portable.sh g++ clang++
      # The runner image has cmake and ninja; only what is missing is fetched, and a stalled mirror connection is
      # dropped and retried instead of using up the job's time.
      - name: Install the tools' dependencies
        run: |
          need=libzydis-dev
          command -v cmake >/dev/null || need="$need cmake"
          command -v ninja >/dev/null || need="$need ninja-build"
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          $apt update -q && $apt install -y -q --no-install-recommends $need
      - name: Build obcmp and obsig
        run: cmake -S tools/obcmp -B build/obcmp -G Ninja && cmake --build build/obcmp
